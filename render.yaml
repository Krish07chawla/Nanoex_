# Render "Blueprint": tells Render how to run the app.
# Steps are in docs/DEPLOYMENT.md.

services:
  - type: web
    name: nanoex
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nanoex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@nanoex.in
      - key: ADMIN_PASSWORD
        sync: false   # you type this in the Render page, it is not stored in Git
      - key: XAI_API_KEY
        sync: false   # your Grok key, typed in the Render page
      - key: MARKET_PROVIDER
        value: yahoo

databases:
  - name: nanoex-db
    plan: free
